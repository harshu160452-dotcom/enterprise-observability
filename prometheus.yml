
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:5000']

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:5000']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:5000']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']